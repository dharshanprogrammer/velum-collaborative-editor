<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Velum — Real-Time Collaborative Document Studio</title>
    <meta name="description" content="Velum is a real-time collaborative document studio with sub-second sync, mathematical CRDTs, and offline resilience." />

    <!-- Typography: Inter + JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Pre-hydration Theme Script - default dark (Cerebrium-style) -->
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('velum_theme') || localStorage.getItem('cowrite_theme');
          if (stored === 'light') {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-background text-text-primary antialiased selection:bg-accent/20 selection:text-accent-foreground overflow-x-hidden min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
